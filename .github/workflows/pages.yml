name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pillow
      - name: Check every reference resolves on a static host
        run: python3 tools/check_portable.py
      - name: Build the site
        run: |
          python3 tools/gallery.py
          mkdir -p public
          cp index.html public/
          cp -r sites public/
          # Each era's original source, kept in the repo but never rendered.
          rm -rf public/sites/*/src
          python3 tools/optimize_for_web.py public
          # Jekyll would otherwise drop files whose names begin with an underscore.
          touch public/.nojekyll
          du -sh public
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
