<!DOCTYPE html>
<html ng-app="taskbaseApp" ng-controller="MainController">

  <head>
    <title>Taskbase</title>
    <meta name="description" content="Die lernende Lernplattform ergänzend zum klassischen Unterricht.">
    <meta name="keywords" content="Lernen, Lernplattform, Adaptiv">
    <meta name="geo.placename" content="Zürich,Schweiz">
    <meta name="ICBM" content="47.3765359,8.5480928">
    <meta name="robots" content="follow,index">
    <meta name="viewport" content="width=device-width">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />

    <!-- Pure CSS -->
    <link href='bower_components/pure/pure-min.css' rel='stylesheet' type='text/css'>

    <!-- bower:css -->
    <link rel="stylesheet" href="bower_components/angular-notify/dist/angular-notify.css" />
    <link rel="stylesheet" href="bower_components/ng-tags-input/ng-tags-input.min.css" />
    <link rel="stylesheet" href="bower_components/textAngular/dist/textAngular.css" />
    <link rel="stylesheet" href="bower_components/bootstrap/dist/css/bootstrap.css" />
    <link rel="stylesheet" href="bower_components/angular-ui-switch/angular-ui-switch.css" />
    <link rel="stylesheet" href="bower_components/angucomplete-alt/angucomplete-alt.css" />
    <link rel="stylesheet" href="bower_components/angularjs-slider/dist/rzslider.css" />
    <!-- endbower -->

    <!-- Fonts (were fonts.googleapis.com Lato + Raleway, vendored locally) -->
    <link rel="stylesheet" href="assets/css/fonts.css">
    <link rel="stylesheet" href="bower_components/font-awesome/css/font-awesome.min.css">

    <!-- injector:css -->
    <link rel="stylesheet" href="assets/css/app.css">
    <!-- endinjector -->

    <!-- Custom Css -->
    <link ng-if="urlContains('e-maths')" rel="stylesheet" ng-href="assets/custom-css/e-maths.css">

    <link rel="icon" sizes="32x32" href="assets/img/icons/favicon.png">

    <link rel="stylesheet" href="museum/badge.css">
  </head>


  <body>
    <div ng-if="appReady">
      <!-- Taskbase application content -->
      <div class="header">
        <div ui-view="headerView"></div>
      </div>

      <div class="main container">
        <div ui-view="mainView"></div>
      </div>

      <div class="footer">
        <div ui-view="footerView"></div>
      </div>
    </div>

    <!-- bower:js -->
    <script src="bower_components/modernizr/modernizr.js"></script>
    <script src="bower_components/angular/angular.js"></script>
    <script src="bower_components/jquery/dist/jquery.js"></script>
    <script src="bower_components/angular-resource/angular-resource.js"></script>
    <script src="bower_components/angular-ui-router/release/angular-ui-router.js"></script>
    <script src="bower_components/angular-animate/angular-animate.js"></script>
    <script src="bower_components/angular-contenteditable/angular-contenteditable.js"></script>
    <script src="bower_components/angular-notify/dist/angular-notify.js"></script>
    <script src="bower_components/spin.js/spin.js"></script>
    <script src="bower_components/angular-spinner/angular-spinner.js"></script>
    <script src="bower_components/angular-loading-spinner/angular-loading-spinner.js"></script>
    <script src="bower_components/angular-base64-upload/src/angular-base64-upload.js"></script>
    <script src="bower_components/angular-popover-toggle/popover-toggle.js"></script>
    <script src="bower_components/ng-tags-input/ng-tags-input.min.js"></script>
    <script src="bower_components/ng-file-upload/ng-file-upload.js"></script>
    <script src="bower_components/rangy/rangy-core.js"></script>
    <script src="bower_components/rangy/rangy-classapplier.js"></script>
    <script src="bower_components/rangy/rangy-highlighter.js"></script>
    <script src="bower_components/rangy/rangy-selectionsaverestore.js"></script>
    <script src="bower_components/rangy/rangy-serializer.js"></script>
    <script src="bower_components/rangy/rangy-textrange.js"></script>
    <script src="bower_components/textAngular/dist/textAngular.js"></script>
    <script src="bower_components/textAngular/dist/textAngular-sanitize.js"></script>
    <script src="bower_components/textAngular/dist/textAngularSetup.js"></script>
    <script src="bower_components/bootstrap/dist/js/bootstrap.js"></script>
    <script src="bower_components/angular-bootstrap/ui-bootstrap-tpls.js"></script>
    <script src="bower_components/angular-ui-ace/ui-ace.js"></script>
    <script src="bower_components/angular-ui-switch/angular-ui-switch.js"></script>
    <script src="bower_components/angular-drag-and-drop-lists/angular-drag-and-drop-lists.js"></script>
    <script src="bower_components/angular-youtube-mb/src/angular-youtube-embed.js"></script>
    <script src="bower_components/angucomplete-alt/angucomplete-alt.js"></script>
    <script src="bower_components/ace-builds/src-min-noconflict/ace.js"></script>
    <script src='bower_components/angularjs-slider/dist/rzslider.js'></script>
    <!-- endbower -->

    <!-- stands in for the CDN globals the page loaded from google.com / cdn.mathjax.org -->
    <script src="museum/era-globals.js"></script>

    <!-- injector:js -->
    <script src="components/app/app.js"></script>
    <script src="components/app/main-controller.js"></script>
    <script src="components/app/routes.js"></script>
    <script src='components/directives/task-search/task-search-directive.js'></script>
    <script src="components/footer/footer-controller.js"></script>
    <script src="components/header/header-controller.js"></script>
    <script src="components/landing/landing-controller.js"></script>
    <script src="components/services/blocks.js"></script>
    <script src="components/services/collection.js"></script>
    <script src="components/services/copy.js"></script>
    <script src="components/services/course.js"></script>
    <script src="components/services/factories/delete-item.js"></script>
    <script src="components/services/image-processor.js"></script>
    <script src="components/services/message.js"></script>
    <script src="components/services/mobile.js"></script>
    <script src="components/services/navigation.js"></script>
    <script src="components/services/objective.js"></script>
    <script src="components/services/permission.js"></script>
    <script src="components/services/share.js"></script>
    <script src="components/services/store.js"></script>
    <script src="components/services/submission.js"></script>
    <script src="components/services/task.js"></script>
    <script src="components/services/user-service.js"></script>
    <script src="components/services/utilities.js"></script>
    <!-- endinjector -->

    <!-- museum: answers the Java backend's endpoints so the app boots offline -->
    <script src="museum/backend.js"></script>

    <div class="museum-badge" onclick="this.classList.toggle('open')">
      <span class="museum-badge-tag">exhibit</span>
      <span class="museum-badge-body">Taskbase landing page, monorepo <code>7739ba389a</code>
      (2015-12-17), running on its own AngularJS 1.3.20. Backend endpoints are
      stubbed, so search returns nothing.</span>
    </div>
  </body>
</html>
