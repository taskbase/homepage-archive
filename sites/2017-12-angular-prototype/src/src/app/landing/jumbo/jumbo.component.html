<div class="jumbo-wrapper">
  <img src="assets/img/bg-clipped.png"
       *ngIf="showImage"
       class="jumbo-img">
  <img src="assets/img/logos/taskbase-watermark.svg"
       class="jumbo-watermark">
  <div class="jumbo-content">
    <div class="jumbo-headline">
      Wir entwickeln Ihr Lernsytem
    </div>
    <div class="jumbo-text">
      Taskbase stellt moderne Lernsysteme für Schulen und Universitäten her.
    </div>
    <div class="form-wrapper">
      <form class="jumbo-newsletter" [formGroup]="newsletterForm" novalidate (ngSubmit)="onSubmit()">
        <input class="newsletter-email" formControlName="email" placeholder="Email Adresse..." type="email">
        <div class="newsletter-submit-button">
          <button mat-raised-button
                  type="submit"
                  [disabled]="newsletterForm.invalid && newsletterForm.touched">
            Newsletter abonnieren
          </button>
        </div>
      </form>
      <div class="errors">
        <div *ngIf="newsletterForm.touched && email.hasError('email') && !email?.hasError('required')">
          Bitte geben Sie eine gültige Email Adresse ein.
        </div>
        <div *ngIf="newsletterForm.touched && email?.hasError('required')">
          Sie müssen eine Email eingeben.
        </div>
      </div>
    </div>
  </div>
</div>
