<html>
<head>
<title>TaskBase Login</title>
<meta http-equiv="Content-Type" content="text/html; charset=iso-8859-1">
</head>

<body bgcolor="#0099CC"  onLoad="document.forms.TaskBaseLogin.StaffLogin.focus()">
<p align="center"><b><font face="Arial, Helvetica, sans-serif" size="6" color="#FFFFFF">TaskBase.com 
  Login</font></b></p>



<form name="TaskBaseLogin" method="post" action="tasklogin.cfm">
  <table width="290" border="0" cellspacing="0" cellpadding="0" align="center">
    <tr> 
      <td width="140"> 
        <div align="right"><font color="#FFFFFF" face="Arial, Helvetica, sans-serif">Login 
          : </font></div>
      </td>
      <td width="150"> 
        <input type="text" name="StaffLogin">
      </td>
    </tr>
    <tr> 
      <td width="140"> 
        <div align="right"><font color="#FFFFFF" face="Arial, Helvetica, sans-serif">Password 
          : </font></div>
      </td>
      <td width="150"> 
        <input type="password" name="StaffPass">
      </td>
    </tr>
    <tr> 
      <td width="140"> 
        <div align="right"> 
          <input type="submit" name="Submit" value="Submit">
        </div>
      </td>
      <td width="150"> 
        <input type="reset" name="Submit2" value="Reset">
      </td>
    </tr>
  </table>
</form>




<div id="museum-badge" style="position:fixed;right:10px;bottom:10px;z-index:2147483647;
  font:12px/1.45 system-ui,sans-serif;max-width:min(360px,calc(100vw - 24px));text-align:left">
  <div id="museum-badge-body" hidden style="background:#1b1b1bee;color:#e8e8e8;padding:10px 12px;
    border-radius:8px;margin-bottom:6px;box-shadow:0 2px 10px #0006">Museum note: this is not Taskbase. A previous owner of the taskbase.com domain served this staff login in 2002 — Taskbase the company was founded in 2015 and only got the domain in 2016.</div>
  <button type="button" onclick="var b=document.getElementById('museum-badge-body');b.hidden=!b.hidden"
    style="all:unset;cursor:pointer;background:#1b1b1b99;color:#cfcfcf;padding:4px 9px;
    border-radius:999px;float:right">not Taskbase</button>
</div>
</body>
</html>
