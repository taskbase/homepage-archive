<div>
  
  <div class="row">
    <div class="col-sm-8 col-sm-offset-2">

      <div ng-show="!signupFormSubmitted && !signingUp">
        <h2 class="center">{{'Sign Up' | translate}}</h2>
        <br>
        <form role="form" name="sign-up-form" class="form-one" ng-submit="signUp()">
          <div class="form-group clearfix">
  
            <md-input-container  class="md-block">
              <label>{{'Full name' | translate}}</label>
              <input type="text" ng-model="user.fullName">
            </md-input-container>
  
            <md-input-container class="md-block">
              <label name="signup-email" autocomplete="false" >E-mail</label>
              <input type="email" ng-model="user.email" required>
            </md-input-container>
  
            <md-input-container  class="md-block">
              <label>{{'Password' | translate}}</label>
              <input type="password" autocomplete="new-password" ng-model="user.password" required>
            </md-input-container>
  
            <md-radio-group layout="row" layout-align="center" ng-model="user.userType">
              <md-radio-button value="teacher" id="teacher">
                <span>{{"I'm a teacher" | translate}}</span>
              </md-radio-button>
              <md-radio-button value="student" id="student">
                <span>{{"I'm a student" | translate}}</span>
              </md-radio-button>
            </md-radio-group>
            <div class="center" style="margin-top: 30px">
              <md-button class="md-accent md-raised" id="submit-signup-button" type="submit">
                <span><i class="fa fa-paper-plane"></i> <span>{{'Sign Up' | translate}}</span></span>
              </md-button>
            </div>
            
          </div>
          
        </form>  
      </div>

      <!-- Loading -->
      <div class="center vertical-center" ng-if="signingUp" style="height: 600px">
        <spinner></spinner>
      </div>

    </div>
  </div>
  
</div>
