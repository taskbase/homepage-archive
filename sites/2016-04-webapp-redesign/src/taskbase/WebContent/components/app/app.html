  <link rel="stylesheet" href="/assets/css/app.css?v=3.7.6">
  <link ng-if="urlContains('e-maths')" rel="stylesheet" ng-href="/assets/custom-css/e-maths.css?v=3.7.4">
  
  
  <link rel="icon" sizes="32x32" href="/assets/img/icons/favicon.png">
  
  <link href='https://fonts.googleapis.com/css?family=Lato' rel='stylesheet' type='text/css'>
  
</head>
<body>

<!-- Loading Spinner -->
<div class="vertical-center" ng-if="false" style="height: 100vh;">
  <div class="center">
    <span class="tb-spinner inline-block"></span>
  </div>
</div>

<!-- Actual App -->
<web-app ng-if="appReady"></web-app>

<!-- Youtube -->
<script async src="https://www.youtube.com/iframe_api"></script>
