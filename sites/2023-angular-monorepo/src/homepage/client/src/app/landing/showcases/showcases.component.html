<div class="content-container">
  <div class="showcases">
    <div class="title">
      Auf den Plattformen von Taskbase Lernen und Lehren über 1000 Lernende,
      Studierende, Lehrpersonen und Professoren und Professorinnen pro Tag.
    </div>
    <div class="logowrapper">
      <div class="logo" *ngFor="let showcase of showcases">
        <img [src]="showcase.logo" [ngStyle]="showcase.style" />
        <h2 class="textbottem">{{ showcase.year }}</h2>
      </div>
    </div>
  </div>
</div>
