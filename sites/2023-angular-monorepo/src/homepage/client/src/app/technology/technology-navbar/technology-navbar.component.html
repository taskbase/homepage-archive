<div class="content-container">
  <div class="content">
    <!-- <h1   class="title">Weitere Technologie Bausteine</h1>-->
    <div class="tags">
      <a
        [id]="'techmodulnavbar-' + tech.title"
        class="linkbox"
        *ngFor="let tech of techs; let i = index"
        [routerLink]="['/technology', tech.link]"
      >
        <img [src]="techs[(i % 2) * 3].pic2" class="pic" />
        <h1 class="techtitle">{{ tech.title }}</h1>
      </a>
    </div>
  </div>
</div>
