<div class="jumbo-wrapper">
  <div class="content-container">
    <div class="jumbo-container">
      <div class="headline">
        <h1 class="title">Deutsch Fälle</h1>
      </div>

      <img src="/assets/img/girlwithcat.png" class="image" />
      <div class="jumbo-content">
        <app-marker-question
          (changedText)="onChange($event)"
          [studentInput]="studentInput"
          stimulus="Schreibe einen einfachen Satz, welcher einen <b> Genitiv </b> enthält und das Bild
                        mit dem Mädchen und der Katze beschreibt."
        ></app-marker-question>
        <br />
        <button
          id="check"
          class="button"
          (click)="check()"
          *ngIf="showAnswerButton"
        >
          Antworten
        </button>
        <div class="feedback">
          <div class="feedbacktext">
            <h2 class="tile">{{ feedback }}</h2>
            <h2 *ngIf="simulation">
              <a class="link" (click)="simulate()">Schülereingabe simulieren</a
              ><br />
            </h2>
          </div>
        </div>
        <br />
        <button
          id="repeat"
          class="button"
          (click)="back()"
          *ngIf="showRepeatButton"
        >
          Wiederholen
        </button>
        <div class="error"></div>
      </div>
    </div>
  </div>
</div>
